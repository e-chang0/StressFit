title: "[RFC] "
body:
  - type: markdown
    attributes:
      value: "의견 수렴 기한을 적고, 실제 결정 후 결과와 이유를 덧붙여 주세요."
  - type: input
    id: deadline
    attributes:
      label: 의견 수렴 기한
      placeholder: "YYYY-MM-DD (한국 시간)"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: "무엇을 정해야 하고 왜 필요한가요?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안과 예시
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법과 단점
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 의견을 받고 싶은 점
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 결정 기록
      value: "의견 수렴 중"
