name: Cache benchmark
on:
  workflow_dispatch:
  push:
    branches: ['feature/workflow-optimization', 'benchmark/**']
    paths:
      - .github/workflows/cache-benchmark.yml
      - .github/workflows/reusable-ci.yml
      - .github/actions/setup-node/**
      - scripts/ci-timing.js
permissions:
  contents: read
  actions: read
jobs:
  uncached:
    name: No cache sample ${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/reusable-ci.yml
    with:
      cache: false
  seed:
    name: Cold cache seed
    uses: ./.github/workflows/reusable-ci.yml
    with:
      cache: true
      cache-namespace: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      expect-cache: miss
  cached:
    name: Warm cache sample ${{ matrix.sample }}
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/reusable-ci.yml
    with:
      cache: true
      cache-namespace: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      expect-cache: hit
  report:
    name: Publish measured comparison
    needs: [uncached, seed, cached]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { parseMetric, renderBenchmarkReport } = await import(pathToFileURL(resolve('scripts/benchmark-report.js')).href);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: context.runId, filter: 'latest' });
            const samples = [];
            for (const job of jobs.filter(j => /^(No cache sample|Cold cache seed|Warm cache sample)/.test(j.name))) {
              if (job.conclusion !== 'success') throw new Error(`Unsuccessful sample: ${job.name}`);
              const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({ ...context.repo, job_id: job.id });
              const metric = parseMetric(logs.data);
              samples.push({ ...metric, job_name: job.name, job_url: job.html_url, job_ms: Date.parse(job.completed_at) - Date.parse(job.started_at) });
            }
            const evidence = { date: new Date().toISOString().slice(0, 10), run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, samples };
            const report = renderBenchmarkReport(evidence);
            fs.mkdirSync('reports', { recursive: true });
            fs.writeFileSync('reports/cache-benchmark.json', JSON.stringify(evidence, null, 2));
            fs.writeFileSync('reports/cache-benchmark.md', report);
            await core.summary.addRaw(report).write();
      - uses: actions/upload-artifact@v7
        with:
          name: cache-benchmark-evidence
          path: reports/
          retention-days: 30
