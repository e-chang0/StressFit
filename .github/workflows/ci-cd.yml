name: StressFit CI/CD
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare PR base/head or push before/after
        id: filter
        run: node scripts/changed-files.js
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    uses: ./.github/workflows/reusable-ci.yml
    with:
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node }}
      upload-build: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
  deploy:
    name: Deploy changed app to Pages
    needs: [changes, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: stressfit-build
          path: dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - uses: actions/deploy-pages@v5
        id: deployment
  summary:
    name: Pipeline decision
    if: always()
    needs: [changes, verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain run and skip decisions
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CI_CHANGED: ${{ needs.changes.outputs.ci }}
          APP_CHANGED: ${{ needs.changes.outputs.deploy }}
          FILTER_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const e = process.env;
          appendFileSync(e.GITHUB_STEP_SUMMARY, `## Selective pipeline\n\n| Item | Value |\n|---|---|\n| Event | ${e.EVENT} |\n| Ref | ${e.REF} |\n| CI-related changes | ${e.CI_CHANGED} |\n| Deployable app changes | ${e.APP_CHANGED} |\n| Change detection | ${e.FILTER_RESULT} |\n| Matrix verification | ${e.VERIFY_RESULT} |\n| Deployment | ${e.DEPLOY_RESULT} |\n\nDeployment requires a push to main, app changes, and all six verification jobs to pass. Documentation-only changes skip verification and deployment.\n`);
          if (['failure', 'cancelled'].includes(e.FILTER_RESULT) || ['failure', 'cancelled'].includes(e.VERIFY_RESULT) || ['failure', 'cancelled'].includes(e.DEPLOY_RESULT)) process.exitCode = 1;
          JS
