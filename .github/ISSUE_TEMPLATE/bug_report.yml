name: Bug report
description: StressFit에서 발견한 오류를 제보합니다.
title: "[Bug] "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 정보와 기대 동작을 적어 주세요. 건강·계정 관련 개인정보는 포함하지 않습니다.
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 무엇이 잘못되었는지 간결하게 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. 상태 설문 화면으로 이동
        2. ... 입력
        3. ... 버튼 클릭
        4. 오류 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과 및 로그
      description: 민감정보를 제거한 오류 메시지나 스크린샷을 첨부해 주세요.
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - P0 - 서비스 사용 불가
        - P1 - 핵심 기능 장애
        - P2 - 우회 가능한 기능 오류
        - P3 - 경미한 UI/문구 오류
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: "예: Chrome 128 / Windows 11, API v0.1.0"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 중복 이슈를 검색했습니다.
          required: true
        - label: 개인정보와 건강정보를 제거했습니다.
          required: true
